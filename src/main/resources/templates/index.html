
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Students</title></head>
<body>
<h2>Student List</h2>
<a href="/add">Add New Student</a>
<table border="1">
<tr><th>ID</th><th>Name</th><th>Age</th><th>Email</th><th>City</th></tr>
<tr th:each="s : ${students}">
<td th:text="${s.id}"></td>
<td th:text="${s.name}"></td>
<td th:text="${s.age}"></td>
<td th:text="${s.email}"></td>
<td th:text="${s.city}"></td>
</tr>
</table>
</body>
</html>
