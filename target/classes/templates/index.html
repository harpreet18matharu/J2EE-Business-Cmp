<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: #f4f7fb;">

<div class="container mt-5">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-primary text-white rounded-top-4 d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Employee Management System</h2>
            <a th:href="@{/showAddForm}" class="btn btn-light text-primary fw-bold">+ Add Employee</a>
        </div>

        <div class="card-body">
            <table class="table table-hover table-bordered align-middle text-center">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${employeeList}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.firstName}"></td>
                    <td th:text="${e.lastName}"></td>
                    <td th:text="${e.email}"></td>
                    <td>
                        <a th:href="@{/showUpdateForm/{id}(id=${e.id})}" class="btn btn-warning btn-sm">Update</a>
                        <a th:href="@{/deleteEmployee/{id}(id=${e.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this employee?');">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(employeeList)}" class="text-center text-muted mt-3">
                No employees found. Add one to get started.
            </div>
        </div>
    </div>
</div>

</body>
</html>
